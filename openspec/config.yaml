schema: spec-driven

context: |
  Product: Mermaid Animator, a VS Code extension that plays existing Mermaid diagrams as animated, navigable diagrams.
  Product source of truth: vscode-extension-specification.md (v1.1). Requirement IDs (FR-*/NFR-*) and section numbers refer to it.
  Tech stack: TypeScript (strict), npm workspaces monorepo (packages/core, protocol, renderer, webview, extension), esbuild bundles,
  Preact + @preact/signals in the webview, d3-zoom for camera, mermaid 12.x (pinned, lazy-loaded) for validation and Tier 3 fallback,
  Vitest for unit tests, @vscode/test-electron for integration tests.
  Architecture rules: packages/core has no DOM/Node/vscode imports; visual state is a pure function sceneAt(t); the extension host stays
  light and web-compatible; the webview has a strict nonce CSP and no network access.
  Design: "Ink & Ivory" tokens (Ivory light / Graphite dark / high contrast), Formal motion profile, reduced motion honoured.
  Conventions: Conventional Commits; every commit ends with a Co-Authored-By trailer.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules: the full standard is docs/spec-writing.md.
rules:
  specs:
    - 'Follow docs/spec-writing.md.'
    - 'When an outcome depends on two or more conditions (settings, camera mode, playback state, engine, view), write a decision table under a "#### Scenario: … matrix" header instead of several WHEN/THEN scenarios.'
    - 'Decision tables: first column # with stable ids R1, R2, … (never reused); conditions, then outcomes; no blank cells (use *Any* or *N/A*); bold outcome values; short-circuit rows first; the requirement text stays normative.'
    - 'Non-table scenario bullets start with **GIVEN**, **WHEN**, **THEN** or **AND** (AND WHEN / AND THEN for sequences); no RFC 2119 keywords in scenarios or cells.'
    - 'Outcomes name checkable values; failures name the diagnostic code and severity, the logged message rejection, or the exact English string. Never "is rejected", "shows an error", "properly", "as expected".'
    - 'Name settings by key, default and @animator short name; state the reduced-motion outcome of any animation; put limits in a **Constraints:** list exercised by a scenario or row.'
    - 'Non-goals go inside ## Purpose, never a separate section. A MODIFIED block copies every existing scenario; to drop or convert one, REMOVED + ADDED under a new name with "> **Supersedes:** <old name>".'
    - 'When behaviour is removed or renamed, give every other spec that mentions it a MODIFIED delta in the same change.'
  tasks:
    - 'For every decision table in the deltas, add one task naming the table and its test (it.each in Vitest, an integration test, or a harness checklist), one case per row id.'
    - 'When the change has a user-observable effect, end with a task that adds a kind-prefixed entry under ## Unreleased in packages/extension/CHANGELOG.md (docs/versioning.md).'

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
